<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>궤적 비교 — 매핑 vs 주행</title>
  <meta name="description" content="GPS 기록 CSV를 위성지도 위에 그리고 열 값으로 색을 입혀 비교하는 브라우저 도구. 파일은 서버로 가지 않습니다.">
  <link rel="stylesheet" href="style.css">
</head>
<body>
<div id="map"></div>

<aside id="panel">
  <div class="panel-head">
    <div class="tabs"><span class="tab active">궤적 비교</span></div>
    <button id="collapse" class="icon-btn" title="접기" aria-label="패널 접기">−</button>
  </div>

  <div class="panel-body">
    <div class="drop">
      <p>CSV를 여기(또는 지도 아무 곳)로 끌어다 놓기</p>
      <div class="drop-btns">
        <label class="btn primary">파일 선택<input type="file" id="file" accept=".csv,.txt,text/csv" multiple hidden></label>
      </div>
      <div id="samples" class="samples"></div>
    </div>
    <p id="msg" class="msg" role="status"></p>

    <ul id="tracks" class="tracks"></ul>

    <div class="btn-row">
      <button id="fitAll" class="btn">전체 보기</button>
      <button id="clearAll" class="btn">모두 지우기</button>
    </div>
    <div class="btn-row">
      <button id="baseSat" class="btn active">위성</button>
      <button id="baseRoad" class="btn">일반</button>
    </div>

    <div class="fields">
      <label class="field"><span>색 기준</span><select id="colorBy"></select></label>
      <label class="field"><span>기준 경로</span><select id="ref"></select></label>
    </div>

    <div id="chartBox" class="chartbox" hidden>
      <div class="chart-label">
        세로축: <select id="chartCol" aria-label="그래프 열"></select>
        · <select id="chartTrack" aria-label="그래프 파일"></select>
      </div>
      <canvas id="chart"></canvas>
      <div class="chart-axis"><span>0</span><span id="chartEnd"></span></div>
    </div>
    <div id="legend" class="legend"></div>

    <section id="sel" class="sel" hidden>
      <div class="sel-head"><b>선택 지점</b><button id="selClear" class="btn small">해제</button></div>
      <dl id="selRows"></dl>
    </section>
  </div>

  <div class="panel-foot">
    <a href="https://github.com/Anjabom/Anjabom.github.io#readme" target="_blank" rel="noopener">사용법</a>
    <a href="https://github.com/Anjabom/Anjabom.github.io" target="_blank" rel="noopener">소스</a>
    <span id="mapName"></span>
  </div>
</aside>

<div class="drop-overlay">여기에 놓으면 불러와요</div>

<script src="app.js"></script>
</body>
</html>
